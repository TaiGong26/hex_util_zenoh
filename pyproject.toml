[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hex_util_runtime"
version = "0.0.1-alpha.15"
description = "HEXFELLOW Runtime Utilities"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Dong Zhaorui", email = "joray.dong@hexfellow.com" }]
maintainers = [
  { name = "jecjune", email = "zejun.chen@hexfellow.com" },
  { name = "Dong Zhaorui", email = "joray.dong@hexfellow.com" },
]
keywords = ["hex", "util", "runtime"]
requires-python = ">=3.8"
dependencies = ["numpy>=2.2.6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]


[project.urls]
Homepage = "https://github.com/hexfellow/hex_util_runtime"
Repository = "https://github.com/hexfellow/hex_util_runtime.git"
"Bug Tracker" = "https://github.com/hexfellow/hex_util_runtime/issues"
Documentation = "https://github.com/hexfellow/hex_util_runtime/wiki"
